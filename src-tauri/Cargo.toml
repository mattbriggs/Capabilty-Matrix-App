[package]
name = "capability-ownership-app"
version = "0.1.0"
description = "Capability and Ownership Matrix desktop shell"
authors = ["Capability and Ownership Matrix"]
edition = "2021"

[lib]
name = "capability_ownership_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
