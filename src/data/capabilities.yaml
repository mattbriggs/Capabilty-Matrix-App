version: 2
project:
  id: sample-capability-ownership
  name: Capability and ownership sample
  description: Sample project bundled with the app. Create or import a project to record your own data.
  createdAt: 2026-10-29T00:00:00Z
  updatedAt: 2026-10-29T00:00:00Z
settings:
  ownerLabels:
    appliance: Appliance
    federated: Federated
  audiences:
    - id: client
      label: Client
      description: Uses and funds the capability
      need: Clear outcomes, usable guidance and a dependable operating experience.
    - id: consultant
      label: Consultant
      description: Advises, designs and enables
      need: Practical guidance for tailoring the product to a client context.
    - id: product-team
      label: Product team
      description: Builds and operates the product
      need: A clear product boundary, data contract and implementation ownership.
    - id: leadership
      label: Leadership
      description: Sets direction and allocates resources
      need: A defensible scope decision with visible dependencies and risk.
    - id: wider-domain
      label: Wider domain
      description: Extends value across the ecosystem
      need: How local capabilities contribute to the evolving domain solution.
  timeline:
    granularity: quarter
    start: 2026-10-01
    periods: 9
    asOf: 2026-10-01
capabilities:
  - id: contextual-guidance
    name: Contextual guidance
    summary: Relevant, in-device and external guidance at the point of need.
    decision: Define the handoff from product-owned guidance to a federated content service.
    owner: appliance
    futureOwner: federated
    current: 3
    target: 5
    levels:
      - id: emerging
        name: Emerging
        description: Ad hoc content with no shared approach.
      - id: initial
        name: Initial
        description: Basic in-app help and FAQs.
      - id: defined
        name: Defined
        description: Consistent topics and terminology.
      - id: managed
        name: Managed
        description: Product-owned guidance delivered in device.
      - id: measured
        name: Measured
        description: Contextual, task-based guidance.
      - id: optimized
        name: Optimized
        description: Shared guidance across products.
      - id: scaled
        name: Scaled
        description: Partners and clients integrated.
      - id: extended
        name: Extended
        description: Guidance across workflows and channels.
      - id: ecosystem
        name: Ecosystem
        description: Continuing wider-domain evolution.
    dependencies:
      - deployment-metadata
      - content-service
    domainId: guidance
    audienceIds:
