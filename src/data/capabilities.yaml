presentation:
  defaultGuidance:
    - audienceId: consultant
      levelId: initial
      text: Relies on local knowledge and experience.
    - audienceId: consultant
      levelId: managed
      text: Clear implementation guidance is available.
    - audienceId: consultant
      levelId: optimized
      text: Scenario-based guidance reduces time to value.
    - audienceId: consultant
      levelId: extended
      text: Federated delivery supports reuse across clients.
    - audienceId: client
      levelId: initial
      text: Little help at the point of need.
    - audienceId: client
      levelId: managed
      text: In-device help covers common tasks.
    - audienceId: client
      levelId: optimized
      text: Contextual guidance appears when needed.
    - audienceId: client
      levelId: extended
      text: Help follows the workflow across channels.
    - audienceId: product-team
      levelId: initial
      text: Content and decisions are hard to reuse.
    - audienceId: product-team
      levelId: managed
      text: Product metadata and topic structure are defined.
    - audienceId: product-team
      levelId: optimized
      text: A stable data contract supports dynamic guidance.
    - audienceId: product-team
      levelId: extended
      text: Product metadata feeds the shared service.
    - audienceId: leadership
      levelId: initial
      text: Scope is difficult to explain.
    - audienceId: leadership
      levelId: managed
      text: Product value and boundaries become visible.
    - audienceId: leadership
      levelId: optimized
      text: Handoff cost and responsibility can be planned.
    - audienceId: leadership
      levelId: extended
      text: Wider-domain value can be assessed.
